name: Actualizar datos de CONSAR

# El boton: Actions -> "Actualizar datos de CONSAR" -> Run workflow.
# Y ademas se dispara solo: CONSAR publica a mitad de mes, asi que se intenta
# el dia 15 y de nuevo el 22 por si esa vez publicaron tarde.
on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Mes/año inicial (ej. 1/2019)"
        required: false
        default: "1/2019"
      hasta:
        description: "Mes/año final (vacío = mes anterior al actual)"
        required: false
        default: ""
  schedule:
    - cron: "0 14 15,22 * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cosechar SISET
        run: |
          python src/cosechar_consar.py \
            --ini "${{ inputs.desde || '1/2019' }}" \
            --fin "${{ inputs.hasta }}"

      - name: Cargar a DuckDB y validar
        run: python src/cargar.py

      - name: Reconstruir la página
        run: python src/construir_pagina.py

      - name: Publicar el cambio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crudos/ datos/ docs/
          if git diff --staged --quiet; then
            echo "Sin cambios: CONSAR no ha publicado nada nuevo."
            exit 0
          fi
          git commit -m "datos: actualización de CONSAR $(date -u +%Y-%m-%d)"
          git push

      - name: Guardar el Parquet como artefacto de la corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allocations-parquet
          path: datos/allocations.parquet
          if-no-files-found: warn
